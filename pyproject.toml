[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zt-resmp"
version = "0.1.0"
description = "Operational diagnostics and safe profiles for official ZeroTier agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "RESMP-DEV" }]
keywords = ["zerotier", "networking", "diagnostics", "tailscale", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
zt-resmp = "zt_resmp:main"

[project.urls]
Homepage = "https://github.com/RESMP-DEV/zt-resmp"
Issues = "https://github.com/RESMP-DEV/zt-resmp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zt_resmp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
